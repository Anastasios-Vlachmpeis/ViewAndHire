<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Session - ViewAndHired</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="app-header">
    <a href="/">ViewAndHired</a>
  </header>
  <main class="container">
    <div class="card">
      <div class="phase-label" id="phaseLabel">Ready</div>
      <div class="timer-display" id="timer">--</div>
      <p id="questionMeta" class="muted" style="text-align:center;"></p>
      <h2 id="questionText" style="text-align:center;"></h2>
      <div class="preview-wrap" id="previewWrap" hidden>
        <video id="preview" autoplay muted playsinline></video>
        <div class="face-overlay" id="liveFaceOverlay" hidden>
          <div class="overlay-labels live-gaze-labels" id="liveGazeLabels"></div>
        </div>
      </div>
      <p id="liveGazeStatus" class="muted" style="text-align:center;" hidden></p>
      <div class="actions" style="justify-content:center;">
        <button class="btn btn-primary" id="startBtn">Begin interview</button>
        <button class="btn btn-secondary" id="skipBtn" hidden>Skip question</button>
        <button class="btn btn-danger" id="stopBtn" hidden>Finish & analyze</button>
      </div>
      <p id="status" class="muted" style="text-align:center;"></p>
    </div>
    <div class="card" id="uploadCard" hidden>
      <h2>Analyzing your interview</h2>
      <div class="status-banner" id="uploadStatus">Uploading recording...</div>
      <div class="score-bar"><span id="progressBar" style="width:0%"></span></div>
      <p id="progressMessage" class="muted"></p>
      <div class="actions">
        <button class="btn btn-secondary" id="retryBtn" hidden>Retry analysis</button>
      </div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/live-gaze.js"></script>
  <script src="/js/session.js"></script>
</body>
</html>
